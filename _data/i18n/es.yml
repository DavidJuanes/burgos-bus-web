story:
  kicker: Funciones
  title: Todo lo que necesitas en la parada
  intro: Siete paradas por la app. Baja la página y el móvil te enseña cada pantalla.
  route:
    title: Calcula tu ruta
    text: Dinos adónde vas y te decimos qué bus coger, cuánto esperar y cuánto andar, con los tiempos en tiempo real de cada parada. Después, la guía de viaje te avisa paso a paso.
    first_title: Directa · Hospital Universitario
    first_detail: ~ 6 min andando · espera 3 min
    first_time: 27 min
    first_arrival: Llegada 19:09
    second_title: Directa · Hospital Universitario
    second_detail: ~ 8 min andando
    second_time: ~ 28 min
