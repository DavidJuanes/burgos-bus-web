  stop:
    title: Reconoce tu parada
    text: Cada parada tiene su foto de Street View, una brújula que te indica hacia dónde está y las llegadas de todas sus líneas.
    detail: Parada 183 · a 730 m
    chips: ["✎ Renómbrala: «Trabajo»", ★ Favorita, Compartir]
    alt: Detalle de la parada Avda. Arlanzón 19 con su foto
  lines:
    title: Todas las líneas
    text: Las regulares, las especiales y los Búho nocturnos, con su recorrido de ida y vuelta, su horario y si están en servicio ahora mismo. Con las horas de salida de las que tienen pocos viajes y las paradas que solo se hacen a ciertas horas.
    active: ● Activa
    chips: [Cada 8 min, Ida y vuelta, "Búho nocturno: 87 y 88"]
    alt: Recorrido de la línea 1, Avda. Arlanzón - Gamonal
  map:
    title: Toda la red en el mapa
    text: Todas las paradas y el recorrido de las líneas por las calles. Combina las líneas que quieras y toca una parada para ver sus llegadas o cómo llegar a pie.
    legend: Las 28 líneas
    chips: [458 paradas, Cómo llegar a pie, Modo oscuro]
    alt: Mapa de Burgos en la app, con las paradas y los recorridos de cuatro líneas
  fares:
    title: Tarifas a mano
    text: Billetes y abonos con su precio, según la ordenanza fiscal municipal, para saber qué te conviene antes de subir.
