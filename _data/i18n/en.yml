story:
  kicker: Features
  title: Everything you need at the stop
  intro: Seven stops along the app. Scroll down and the phone shows you each screen.
  route:
    title: Plan your route
    text: Tell us where you're going and we'll tell you which bus to take, how long to wait and how far to walk, with real-time arrivals at every stop. Then trip guidance takes you through it step by step.
    first_title: Direct · University Hospital
    first_detail: ~ 6 min on foot · wait 3 min
    first_time: 27 min
    first_arrival: Arrival 19:09
    second_title: Direct · University Hospital
    second_detail: ~ 8 min on foot
    second_time: ~ 28 min
    second_arrival: Arrival ~ 19:10
    chips: [Home and Work, Recent destinations, Step-by-step trip guidance]
    alt: Route tab with the trip to the University Hospital drawn on the map and the bus options
  nearby:
    title: Near you
    text: Your favourite stops and the closest ones, with the next arrivals of every line.
    in: "in %m min"
    now: Arriving
    first_away: In real time
    first_then: then in 18 min
    second_away: In real time
    second_then: then in 26 min
    chips: [Updates by itself, Favourites with your own names, Search by number or name]
    alt: Nearby screen with favourite and nearby stops
  stop:
    title: Recognise your stop
    text: Every stop has its Street View photo, a compass that points the way, and the arrivals of all its lines.
    detail: Stop 183 · 730 m away
    chips: ["✎ Rename it: “Work”", ★ Favourite, Share]
    alt: Avda. Arlanzón 19 stop detail with its photo
  lines:
    title: Every line
    text: Regular, special and night (Búho) lines, with their outbound and return routes, their timetable and whether they're running right now. With the departure times of those with few trips and the stops only served at some hours.
    active: ● Running
    chips: [Every 8 min, Outbound and return, "Night Búho: 87 and 88"]
    alt: Route of line 1, Avda. Arlanzón - Gamonal
  map:
    title: The whole network on a map
    text: Every stop and the route of each line through the streets. Combine any lines you like and tap a stop to see its arrivals or walking directions.
    legend: The 28 lines
    chips: [458 stops, Walking directions, Dark mode]
    alt: Map of Burgos in the app, with the stops and the routes of four lines
  fares:
    title: Fares at hand
    text: Tickets and passes with their price, from the city's tax bylaw, so you know what suits you before you board.
    tickets:
      - { name: Single ticket, price: "€1.20" }
      - { name: Bonobur card, price: "€0.24", unit: per trip }
      - { name: Youth pass, price: "€0.13", unit: per trip }
    chips: [Reduced fare, Night Búho, Free transfer within 45 min]
    alt: Fares screen
  yours:
    title: Your way
    text: Choose how to see arrival times, the theme and the language. Works with TalkBack and large text.
    toggle: "Arrival format: minutes or clock time"
    relative: in 2 min
    clock: "10:02"
    chips: [◐ Light and dark, ES · EN, Aa Large text, TalkBack]
    alt: Nearby screen in dark mode, with times in minutes

